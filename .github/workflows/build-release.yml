name: Build dms-shell-git (x86-64-v3)

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  build:
    name: Build DMS x86-64-v3 / Zen 3
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      # -------------------------
      # Update system
      # -------------------------
      - name: Update base system
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            base-devel \
            git \
            sudo \
            curl \
            go \
            make \
            quickshell \
            binutils

      # -------------------------
      # Create builder user
      # -------------------------
      - name: Create builder user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      # -------------------------
      # Create PKGBUILD
      # -------------------------
      - name: Create PKGBUILD
        run: |
          cat > /home/builder/PKGBUILD <<'EOF'
          pkgname=dms-shell-git
          pkgver=0
          pkgrel=1

          pkgdesc="Dank Material Shell (Git, x86-64-v3, Zen 3)"
          arch=('x86_64')

          url="https://github.com/AvengeMedia/DankMaterialShell"
          license=('MIT')

          depends=(
            dgop
            quickshell
            accountsservice
          )

          makedepends=(
            git
            go
            make
          )

          optdepends=(
            'cava: Audio visualizer'
            'i2c-tools: External monitor brightness control'
            'matugen: Dynamic wallpaper-based theming'
            'qt6-multimedia: Sound effect support'
            'power-profiles-daemon: Set power profile'
            'qt6ct: Qt6 application theming'
            'cups-pk-helper: Printer Management'
            'greetd-dms-greeter: DMS Greeter'
          )

          provides=(
            dms-shell
            dms-git
          )

          conflicts=(
            dms-shell
            dms-git
          )

          source=("git+$url.git")
          sha256sums=('SKIP')

          pkgver() {
              cd DankMaterialShell

              git describe \
                --long \
                --tags \
                --abbrev=7 \
                --match="v*" \
                HEAD 2>/dev/null \
                | sed 's/^v//;s/\([^-]*-g\)/r\1/;s/-/./g' \
                || echo "0.0.0.r0.$(git rev-parse --short=7 HEAD)"
          }

          prepare() {
              cd DankMaterialShell

              if [ -f .gitmodules ]; then
                  git submodule sync
                  git submodule update --init --recursive
              fi
          }

          build() {
              cd DankMaterialShell/core

              # =================================
              # CPU / Go target
              # =================================

              # x86-64-v3 baseline for Go.
              export GOAMD64=v3

              # =================================
              # CGO
              # =================================

              # Upstream Makefile forces CGO_ENABLED=0
              # for its normal "make" target.
              #
              # We intentionally bypass that target and
              # invoke go build directly, like Chaotic AUR.
              export CGO_ENABLED=1

              # =================================
              # Zen 3 C/C++ optimization
              # =================================

              export CFLAGS="-march=znver3 -mtune=znver3 -O3 -pipe -fno-plt"
              export CXXFLAGS="$CFLAGS"
              export CPPFLAGS="$CFLAGS"

              export LDFLAGS="-Wl,-O1,--as-needed"

              export CGO_CPPFLAGS="$CPPFLAGS"
              export CGO_CFLAGS="$CFLAGS"
              export CGO_CXXFLAGS="$CXXFLAGS"
              export CGO_LDFLAGS="$LDFLAGS"

              # =================================
              # Build metadata
              # =================================

              VERSION="$(git describe --tags --always 2>/dev/null || echo dev)"
              BUILD_TIME="$(date -u '+%Y-%m-%d_%H:%M:%S')"
              COMMIT="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"

              # =================================
              # Go linker flags
              # =================================

              LDFLAGS_GO="-s -w \
                -X main.Version=${VERSION} \
                -X main.buildTime=${BUILD_TIME} \
                -X main.commit=${COMMIT} \
                -linkmode=external"

              # =================================
              # Embed Quickshell UI
              # =================================

              make sync-shell

              # =================================
              # Go build
              # =================================

              GOFLAGS="-buildmode=pie -trimpath -mod=readonly -modcacherw"

              go build \
                -tags 'distro_binary withshell' \
                -ldflags "$LDFLAGS_GO" \
                $GOFLAGS \
                -o dms \
                ./cmd/dms
          }

          package() {
              cd DankMaterialShell

              install -Dm0755 \
                core/dms \
                "$pkgdir/usr/bin/dms"

              install -dm0755 \
                "$pkgdir/usr/share/quickshell/dms"

              cp -a quickshell/. \
                "$pkgdir/usr/share/quickshell/dms/"
          }
          EOF

          chown -R builder:builder /home/builder

      # -------------------------
      # Build package
      # -------------------------
      - name: Build package
        run: |
          su builder -c '
            export MAKEFLAGS="-j$(nproc)"
            cd /home/builder
            makepkg -s --cleanbuild --noconfirm
          '

      # -------------------------
      # Verify the actual pkgdir
      # -------------------------
      #
      # IMPORTANT:
      # We intentionally verify:
      #
      #   /home/builder/pkg/dms-shell-git/usr/bin/dms
      #
      # directly.
      #
      # There is NO tar extraction here.
      # -------------------------
      - name: VERIFY DMS x86-64-v3 PIE
        run: |
          set -e

          DMS="/home/builder/pkg/dms-shell-git/usr/bin/dms"

          echo "=========================================="
          echo "DMS BUILD VERIFICATION"
          echo "=========================================="
          echo

          if [ ! -f "$DMS" ]; then
            echo "ERROR: DMS binary not found:"
            echo "$DMS"
            echo
            echo "Available files:"
            find /home/builder/pkg -maxdepth 5 -type f -print || true
            exit 1
          fi

          echo "Binary:"
          echo "$DMS"
          echo

          echo "===== FILE ====="
          file "$DMS"
          echo

          echo "===== ELF HEADER ====="
          readelf -h "$DMS" | \
            grep -E 'Class:|Machine:|Type:'
          echo

          echo "===== DYNAMIC DEPENDENCIES ====="
          readelf -d "$DMS" | \
            grep NEEDED || true
          echo

          echo "===== GO BUILD INFO ====="
          go version -m "$DMS" || true
          echo

          echo "===== SHA256 ====="
          sha256sum "$DMS"
          echo

          echo "===== SIZE ====="
          ls -lh "$DMS"
          echo

          echo "=========================================="
          echo "VERIFICATION PASSED"
          echo "=========================================="

      # -------------------------
      # Locate finished package
      # -------------------------
      - name: Locate package
        id: pkg
        run: |
          set -e

          PKG_PATH=""

          for f in /home/builder/*.pkg.tar.zst; do
            [ -f "$f" ] || continue

            case "$(basename "$f")" in
              *-debug-*.pkg.tar.zst)
                continue
                ;;
              dms-shell-git-*.pkg.tar.zst)
                PKG_PATH="$f"
                break
                ;;
            esac
          done

          if [ -z "$PKG_PATH" ]; then
            echo "ERROR: Main package not found."

            echo
            echo "Files in /home/builder:"
            find /home/builder -maxdepth 1 -type f -print

            exit 1
          fi

          PKG_FILE="$(basename "$PKG_PATH")"

          VERSION="$(
            echo "$PKG_FILE" |
              sed -E \
                's/^dms-shell-git-(.*)-x86_64\.pkg\.tar\.zst/\1/'
          )"

          NEW_NAME="dms-shell-git-${VERSION}-x86_64_v3.pkg.tar.zst"

          mkdir -p /home/builder/release

          cp "$PKG_PATH" \
            "/home/builder/release/$NEW_NAME"

          echo "Main package:"
          echo "$PKG_PATH"

          echo
          echo "Release package:"
          echo "/home/builder/release/$NEW_NAME"

          echo
          echo "Version:"
          echo "$VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # -------------------------
      # Create GitHub Release
      # -------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.version }}-v3
          name: dms-shell-git ${{ steps.pkg.outputs.version }} (x86-64-v3 / Zen 3)
          files: /home/builder/release/*.pkg.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
