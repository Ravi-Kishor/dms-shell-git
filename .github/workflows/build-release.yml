name: Build dms-shell-git (Zen 3 / x86-64-v3)

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:

      # ======================================================
      # Update system
      # ======================================================

      - name: Update base system
        run: |
          pacman -Syu --noconfirm

          pacman -S --needed --noconfirm \
            base-devel \
            git \
            go \
            make \
            curl \
            binutils \
            libarchive \
            sudo \
            quickshell \
            dgop \
            accountsservice

      # ======================================================
      # Create builder user
      # ======================================================

      - name: Create builder user
        run: |
          useradd -m builder

          echo "builder ALL=(ALL) NOPASSWD: ALL" \
            >> /etc/sudoers

      # ======================================================
      # Generate PKGBUILD
      # ======================================================

      - name: Create PKGBUILD
        run: |
          mkdir -p /home/builder/build
          chown -R builder:builder /home/builder

          cat > /home/builder/build/PKGBUILD <<'EOF'
          pkgname=dms-shell-git

          pkgver=0
          pkgrel=1

          pkgdesc='Desktop shell for wayland compositors built with Quickshell & GO'

          arch=(x86_64)

          url='https://github.com/AvengeMedia/DankMaterialShell'

          license=(MIT)

          depends=(
            dgop
            quickshell
            accountsservice
          )

          optdepends=(
            'cava: Audio visualizer'
            'i2c-tools: External monitor brightness control'
            'matugen: Dynamic wallpaper-based theming'
            'qt6-multimedia: Sound effect support'
            'power-profiles-daemon: Set power profile'
            'qt6ct: Qt6 application theming'
            'cups-pk-helper: Printer Management'
            'greetd-dms-greeter: DMS Greeter'
          )

          makedepends=(
            git
            go
            make
          )

          provides=(
            dms-shell=$pkgver
            dms-git
          )

          conflicts=(
            dms-shell
            dms-git
          )

          source=(
            "git+https://github.com/AvengeMedia/DankMaterialShell.git"
            "https://github.com/AvengeMedia/DankMaterialShell/releases/download/v1.5.0/completion.bash"
            "https://github.com/AvengeMedia/DankMaterialShell/releases/download/v1.5.0/completion.fish"
            "https://github.com/AvengeMedia/DankMaterialShell/releases/download/v1.5.0/completion.zsh"
          )

          sha256sums=(
            'SKIP'
            'SKIP'
            'SKIP'
            'SKIP'
          )

          pkgver() {
              cd DankMaterialShell

              git describe \
                  --long \
                  --tags \
                  --abbrev=7 \
                  --match='v*' \
                  HEAD 2>/dev/null |
                  sed 's/^v//;s/\([^-]*-g\)/r\1/;s/-/./g' ||
                  echo "0.0.0.r0.$(git rev-parse --short=7 HEAD)"
          }

          prepare() {
              cd DankMaterialShell

              if [[ -f .gitmodules ]]; then
                  git submodule sync
                  git submodule update --init --recursive
              fi
          }

          build() {
              cd DankMaterialShell/core

              # ==================================================
              # AMD Zen 3 / x86-64-v3
              # ==================================================

              export GOAMD64=v3
              export CGO_ENABLED=1

              export CFLAGS="-march=znver3 -mtune=znver3 -O3 -pipe -fno-plt"
              export CXXFLAGS="$CFLAGS"
              export CPPFLAGS="$CFLAGS"

              export LDFLAGS="-Wl,-O1,--as-needed"

              export CGO_CPPFLAGS="$CPPFLAGS"
              export CGO_CFLAGS="$CFLAGS"
              export CGO_CXXFLAGS="$CXXFLAGS"
              export CGO_LDFLAGS="$LDFLAGS"

              local VERSION BUILD_TIME COMMIT LDFLAGS_GO

              VERSION="$(git describe --tags --always 2>/dev/null || echo dev)"
              BUILD_TIME="$(date -u '+%Y-%m-%d_%H:%M:%S')"
              COMMIT="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"

              LDFLAGS_GO="-s -w \
          -X main.Version=${VERSION} \
          -X main.buildTime=${BUILD_TIME} \
          -X main.commit=${COMMIT} \
          -linkmode=external"

              # Embed Quickshell UI into the Go binary.
              make sync-shell

              GOFLAGS="-buildmode=pie -trimpath -mod=readonly -modcacherw"

              go build \
                  -tags 'distro_binary withshell' \
                  -ldflags "$LDFLAGS_GO" \
                  $GOFLAGS \
                  -o dms \
                  ./cmd/dms
          }

          package() {

              # ==================================================
              # Main binary
              # ==================================================

              install -Dm0755 \
                  DankMaterialShell/core/dms \
                  "$pkgdir/usr/bin/dms"

              # ==================================================
              # Systemd service
              # ==================================================

              install -Dm0644 \
                  "$srcdir/DankMaterialShell/assets/systemd/dms.service" \
                  "$pkgdir/usr/lib/systemd/user/dms.service"

              # ==================================================
              # Shell completions
              # ==================================================

              install -Dm0644 \
                  "$srcdir/completion.bash" \
                  "$pkgdir/usr/share/bash-completion/completions/dms"

              install -Dm0644 \
                  "$srcdir/completion.zsh" \
                  "$pkgdir/usr/share/zsh/site-functions/_dms"

              install -Dm0644 \
                  "$srcdir/completion.fish" \
                  "$pkgdir/usr/share/fish/vendor_completions.d/dms.fish"

              # ==================================================
              # Desktop files
              # ==================================================

              install -Dm0644 \
                  "$srcdir/DankMaterialShell/assets/dms-open.desktop" \
                  "$pkgdir/usr/share/applications/dms-open.desktop"

              install -Dm0644 \
                  "$srcdir/DankMaterialShell/assets/com.danklinux.dms.desktop" \
                  "$pkgdir/usr/share/applications/com.danklinux.dms.desktop"

              install -Dm0644 \
                  "$srcdir/DankMaterialShell/assets/com.danklinux.dms.notepad.desktop" \
                  "$pkgdir/usr/share/applications/com.danklinux.dms.notepad.desktop"

              # ==================================================
              # Icon
              # ==================================================

              install -Dm0644 \
                  "$srcdir/DankMaterialShell/core/assets/danklogo.svg" \
                  "$pkgdir/usr/share/icons/hicolor/scalable/apps/danklogo.svg"

              # ==================================================
              # Documentation
              # ==================================================

              install -Dm0644 \
                  "$srcdir/DankMaterialShell/README.md" \
                  "$pkgdir/usr/share/doc/$pkgname/README.md"

              if [[ -d "$srcdir/DankMaterialShell/docs" ]]; then
                  cp -r \
                      "$srcdir/DankMaterialShell/docs/"* \
                      "$pkgdir/usr/share/doc/$pkgname/"
              fi

              # ==================================================
              # IMPORTANT:
              #
              # Do NOT install:
              #
              # /usr/share/quickshell/dms
              #
              # make sync-shell embeds the UI into dms.
              # ==================================================
          }
          EOF

          chown builder:builder /home/builder/build/PKGBUILD

      # ======================================================
      # Build package
      # ======================================================

      - name: Build Arch package
        run: |
          su builder -c '
            cd /home/builder/build

            export MAKEFLAGS="-j$(nproc)"

            makepkg \
              --syncdeps \
              --cleanbuild \
              --clean \
              --noconfirm
          '

      # ======================================================
      # Verify package
      # ======================================================

      - name: Verify package
        id: verify
        run: |
          set -e

          PKG_PATH="$(
            find /home/builder/build \
              -maxdepth 1 \
              -type f \
              -name "dms-shell-git-*.pkg.tar.zst" \
              ! -name "*-debug-*" |
              head -n1
          )"

          if [[ -z "$PKG_PATH" ]]; then
            echo "ERROR: package not found"
            exit 1
          fi

          echo "Package:"
          ls -lh "$PKG_PATH"

          echo
          echo "===== PACKAGE INFO ====="

          pacman -Qip "$PKG_PATH" |
            grep -E \
              "Name|Version|Installed Size|Architecture"

          echo
          echo "===== PACKAGE TYPE ====="

          file "$PKG_PATH"

          echo
          echo "===== QUICKSHELL PAYLOAD CHECK ====="

          if bsdtar -tf "$PKG_PATH" |
              grep -q "^usr/share/quickshell"; then

            echo "ERROR: package contains external Quickshell payload"
            bsdtar -tf "$PKG_PATH" |
              grep "^usr/share/quickshell"

            exit 1
          fi

          echo "OK: no /usr/share/quickshell payload"

          echo
          echo "===== EXTRACTING PACKAGE ====="

          rm -rf /home/builder/package-check
          mkdir -p /home/builder/package-check

          bsdtar \
            -xf "$PKG_PATH" \
            -C /home/builder/package-check

          DMS="/home/builder/package-check/usr/bin/dms"

          test -f "$DMS"

          echo
          echo "===== DMS BINARY ====="

          ls -lh "$DMS"
          file "$DMS"

          echo
          echo "===== GO BUILD INFO ====="

          go version -m "$DMS" |
            grep -E \
              "path|build|CGO_ENABLED|GOARCH|GOAMD64|GOOS|GOEXPERIMENT|tags|trimpath|vcs.revision"

          echo
          echo "===== VERIFY GOAMD64 ====="

          go version -m "$DMS" |
            grep -q "GOAMD64=v3"

          echo "OK: GOAMD64=v3"

          echo
          echo "===== ELF ====="

          readelf -h "$DMS" |
            grep -E \
              "Type:|Machine:|OS/ABI:"

          echo
          echo "===== DYNAMIC LIBRARIES ====="

          readelf -d "$DMS" |
            grep NEEDED

          echo
          echo "===== SHA256 ====="

          sha256sum "$PKG_PATH" \
            > "${PKG_PATH}.sha256"

          cat "${PKG_PATH}.sha256"

          echo
          echo "===== BUILD ID ====="

          readelf -n "$DMS" |
            grep -A1 "Build ID" || true

          VERSION="$(
            pacman -Qp "$PKG_PATH" |
            sed 's/^dms-shell-git-//' |
            sed 's/-x86_64\.pkg\.tar\.zst$//'
          )"

          echo "Package version: $VERSION"

          mkdir -p /home/builder/release

          cp "$PKG_PATH" \
            /home/builder/release/

          cp "${PKG_PATH}.sha256" \
            /home/builder/release/

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # ======================================================
      # Release
      # ======================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.verify.outputs.version }}-v3
          name: dms-shell-git ${{ steps.verify.outputs.version }} (x86-64-v3 / Zen 3)
          body: |
            ## dms-shell-git

            Built automatically from the latest DankMaterialShell `master`.

            ### Build target

            - Architecture: x86_64
            - GOAMD64: v3
            - CPU tuning: AMD Zen 3 (`znver3`)
            - CGO: enabled
            - Go build mode: PIE
            - Quickshell UI: embedded in `/usr/bin/dms`

            ### Install

            ```bash
            sudo pacman -U dms-shell-git-*.pkg.tar.zst
            ```

            **Requires an x86-64-v3 capable CPU.**

          files: |
            /home/builder/release/*.pkg.tar.zst
            /home/builder/release/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
