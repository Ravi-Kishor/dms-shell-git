name: Build dms-shell-git (Zen 3 / x86-64-v3)

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:

      # ============================================================
      # System
      # ============================================================

      - name: Update base system
        run: |
          pacman -Syu --noconfirm

          pacman -S --needed --noconfirm \
            base-devel \
            git \
            go \
            make \
            curl \
            binutils \
            libarchive \
            sudo \
            quickshell \
            dgop \
            accountsservice

      # ============================================================
      # Builder
      # ============================================================

      - name: Create builder user
        run: |
          useradd -m builder

          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

          mkdir -p /home/builder/dms-build

          chown -R builder:builder /home/builder

      # ============================================================
      # PKGBUILD
      # ============================================================

      - name: Generate PKGBUILD
        run: |
          cat > /home/builder/dms-build/PKGBUILD <<'EOF'
          pkgname=dms-shell-git
          pkgver=0
          pkgrel=1

          pkgdesc='Desktop shell for wayland compositors built with Quickshell & GO'

          arch=(x86_64)

          url='https://github.com/AvengeMedia/DankMaterialShell'

          license=(MIT)

          depends=(
            dgop
            quickshell
            accountsservice
          )

          optdepends=(
            'cava: Audio visualizer'
            'i2c-tools: External monitor brightness control'
            'matugen: Dynamic wallpaper-based theming'
            'qt6-multimedia: Sound effect support'
            'power-profiles-daemon: Set power profile'
            'qt6ct: Qt6 application theming'
            'cups-pk-helper: Printer Management'
            'greetd-dms-greeter: DMS Greeter'
          )

          makedepends=(
            git
            go
            make
          )

          provides=(
            dms-shell=$pkgver
            dms-git
          )

          conflicts=(
            dms-shell
            dms-git
          )

          source=(
            'git+https://github.com/AvengeMedia/DankMaterialShell.git'
            'https://github.com/AvengeMedia/DankMaterialShell/releases/download/v1.5.0/completion.bash'
            'https://github.com/AvengeMedia/DankMaterialShell/releases/download/v1.5.0/completion.fish'
            'https://github.com/AvengeMedia/DankMaterialShell/releases/download/v1.5.0/completion.zsh'
          )

          sha256sums=(
            'SKIP'
            'SKIP'
            'SKIP'
            'SKIP'
          )

          pkgver() {
              cd DankMaterialShell

              git describe \
                  --long \
                  --tags \
                  --abbrev=7 \
                  --match='v*' \
                  HEAD 2>/dev/null |
                  sed 's/^v//;s/\([^-]*-g\)/r\1/;s/-/./g' ||
                  echo "0.0.0.r0.$(git rev-parse --short=7 HEAD)"
          }

          prepare() {
              cd DankMaterialShell

              git submodule sync
              git submodule update --init --recursive
          }

          build() {
              cd DankMaterialShell/core

              # AMD Zen 3 / x86-64-v3
              export GOAMD64=v3
              export CGO_ENABLED=1

              export CFLAGS="-march=znver3 -mtune=znver3 -O3 -pipe -fno-plt"
              export CXXFLAGS="$CFLAGS"
              export CPPFLAGS="$CFLAGS"

              export LDFLAGS="-Wl,-O1,--as-needed"

              export CGO_CPPFLAGS="$CPPFLAGS"
              export CGO_CFLAGS="$CFLAGS"
              export CGO_CXXFLAGS="$CXXFLAGS"
              export CGO_LDFLAGS="$LDFLAGS"

              local VERSION
              local BUILD_TIME
              local COMMIT
              local LDFLAGS_GO

              VERSION="$(git describe --tags --always 2>/dev/null || echo dev)"
              BUILD_TIME="$(date -u '+%Y-%m-%d_%H:%M:%S')"
              COMMIT="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"

              LDFLAGS_GO="-s -w \
          -X main.Version=${VERSION} \
          -X main.buildTime=${BUILD_TIME} \
          -X main.commit=${COMMIT} \
          -linkmode=external"

              make sync-shell

              GOFLAGS="-buildmode=pie -trimpath -mod=readonly -modcacherw"

              go build \
                  -tags 'distro_binary withshell' \
                  -ldflags "$LDFLAGS_GO" \
                  $GOFLAGS \
                  -o dms \
                  ./cmd/dms
          }

          package() {

              install -Dm0755 \
                  DankMaterialShell/core/dms \
                  "$pkgdir/usr/bin/dms"

              install -Dm0644 \
                  DankMaterialShell/assets/systemd/dms.service \
                  "$pkgdir/usr/lib/systemd/user/dms.service"

              install -Dm0644 \
                  "$srcdir/completion.bash" \
                  "$pkgdir/usr/share/bash-completion/completions/dms"

              install -Dm0644 \
                  "$srcdir/completion.fish" \
                  "$pkgdir/usr/share/fish/vendor_completions.d/dms.fish"

              install -Dm0644 \
                  "$srcdir/completion.zsh" \
                  "$pkgdir/usr/share/zsh/site-functions/_dms"

              install -Dm0644 \
                  DankMaterialShell/assets/dms-open.desktop \
                  "$pkgdir/usr/share/applications/dms-open.desktop"

              install -Dm0644 \
                  DankMaterialShell/assets/com.danklinux.dms.desktop \
                  "$pkgdir/usr/share/applications/com.danklinux.dms.desktop"

              install -Dm0644 \
                  DankMaterialShell/assets/com.danklinux.dms.notepad.desktop \
                  "$pkgdir/usr/share/applications/com.danklinux.dms.notepad.desktop"

              install -Dm0644 \
                  DankMaterialShell/core/assets/danklogo.svg \
                  "$pkgdir/usr/share/icons/hicolor/scalable/apps/danklogo.svg"

              install -Dm0644 \
                  DankMaterialShell/README.md \
                  "$pkgdir/usr/share/doc/$pkgname/README.md"

              if [[ -d DankMaterialShell/docs ]]; then
                  cp -r \
                      DankMaterialShell/docs/* \
                      "$pkgdir/usr/share/doc/$pkgname/"
              fi
          }
          EOF

          chown builder:builder \
            /home/builder/dms-build/PKGBUILD

      # ============================================================
      # Build Arch package
      # ============================================================

      - name: Build Arch package
        run: |
          su builder -c '
            cd /home/builder/dms-build

            export MAKEFLAGS="-j$(nproc)"

            makepkg \
              --syncdeps \
              --cleanbuild \
              --clean \
              --noconfirm
          '

      # ============================================================
      # Verify package
      # ============================================================

      - name: Verify package
        id: verify
        run: |
          set -euo pipefail

          BUILD_DIR="/home/builder/dms-build"

          echo "============================================================"
          echo " ALL GENERATED PACKAGES"
          echo "============================================================"

          find "$BUILD_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.pkg.tar.zst' \
            -printf '%f\n' \
            | sort

          # --------------------------------------------------------
          # Select ONLY the main package.
          # Never allow the debug package to be selected.
          # --------------------------------------------------------

          mapfile -t PACKAGES < <(
            find "$BUILD_DIR" \
              -maxdepth 1 \
              -type f \
              -name 'dms-shell-git-*.pkg.tar.zst' \
              ! -name 'dms-shell-git-debug-*' \
              -print
          )

          if [[ "${#PACKAGES[@]}" -ne 1 ]]; then
            echo
            echo "ERROR: Expected exactly ONE main package."
            echo "Found: ${#PACKAGES[@]}"

            printf '%s\n' "${PACKAGES[@]:-}"

            exit 1
          fi

          PKG_PATH="${PACKAGES[0]}"

          echo
          echo "============================================================"
          echo " SELECTED PACKAGE"
          echo "============================================================"

          echo "$PKG_PATH"
          echo "basename: $(basename "$PKG_PATH")"

          if [[ "$(basename "$PKG_PATH")" == *debug* ]]; then
            echo "ERROR: DEBUG PACKAGE WAS SELECTED!"
            exit 1
          fi

          # --------------------------------------------------------
          # Confirm the main binary is actually inside it.
          # --------------------------------------------------------

          echo
          echo "============================================================"
          echo " VERIFY PACKAGE CONTENTS"
          echo "============================================================"

          if ! bsdtar -tf "$PKG_PATH" |
              grep -qx 'usr/bin/dms'; then

            echo "ERROR: usr/bin/dms is missing from main package."

            echo
            echo "Package contents:"
            bsdtar -tf "$PKG_PATH"

            exit 1
          fi

          echo "OK: usr/bin/dms exists."

          echo
          echo "============================================================"
          echo " PACKAGE INFO"
          echo "============================================================"

          pacman -Qip "$PKG_PATH"

          echo
          echo "============================================================"
          echo " PACKAGE SIZE"
          echo "============================================================"

          ls -lh "$PKG_PATH"

          echo
          echo "============================================================"
          echo " PACKAGE FILE TYPE"
          echo "============================================================"

          file "$PKG_PATH"

          # --------------------------------------------------------
          # Ensure Quickshell UI isn't separately packaged.
          # --------------------------------------------------------

          echo
          echo "============================================================"
          echo " QUICKSHELL PAYLOAD CHECK"
          echo "============================================================"

          if bsdtar -tf "$PKG_PATH" |
              grep -q '^usr/share/quickshell'; then

            echo "ERROR: /usr/share/quickshell payload found!"

            bsdtar -tf "$PKG_PATH" |
              grep '^usr/share/quickshell'

            exit 1
          fi

          echo "OK: Quickshell UI is embedded."

          # --------------------------------------------------------
          # Extract package for binary inspection.
          # --------------------------------------------------------

          VERIFY_DIR="/home/builder/package-check"

          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"

          bsdtar \
            -xf "$PKG_PATH" \
            -C "$VERIFY_DIR"

          DMS="$VERIFY_DIR/usr/bin/dms"

          if [[ ! -f "$DMS" ]]; then
            echo "ERROR: extracted usr/bin/dms does not exist."
            exit 1
          fi

          # --------------------------------------------------------
          # Binary information
          # --------------------------------------------------------

          echo
          echo "============================================================"
          echo " DMS BINARY"
          echo "============================================================"

          ls -lh "$DMS"

          file "$DMS"

          echo
          echo "============================================================"
          echo " GO BUILD INFO"
          echo "============================================================"

          go version -m "$DMS" |
            grep -E \
              'path|build|CGO_ENABLED|GOARCH|GOAMD64|GOOS|GOEXPERIMENT|tags|trimpath|vcs.revision'

          # --------------------------------------------------------
          # Hard GOAMD64=v3 check
          # --------------------------------------------------------

          echo
          echo "============================================================"
          echo " GOAMD64 CHECK"
          echo "============================================================"

          if ! go version -m "$DMS" |
              grep -q 'GOAMD64=v3'; then

            echo "ERROR: Binary is NOT GOAMD64=v3."

            exit 1
          fi

          echo "OK: GOAMD64=v3"

          # --------------------------------------------------------
          # ELF
          # --------------------------------------------------------

          echo
          echo "============================================================"
          echo " ELF"
          echo "============================================================"

          readelf -h "$DMS" |
            grep -E 'Type:|Machine:|OS/ABI:'

          # --------------------------------------------------------
          # Dynamic libraries
          # --------------------------------------------------------

          echo
          echo "============================================================"
          echo " DYNAMIC LIBRARIES"
          echo "============================================================"

          readelf -d "$DMS" |
            grep NEEDED || true

          # --------------------------------------------------------
          # Hashes
          # --------------------------------------------------------

          echo
          echo "============================================================"
          echo " BINARY SHA256"
          echo "============================================================"

          sha256sum "$DMS"

          echo
          echo "============================================================"
          echo " PACKAGE SHA256"
          echo "============================================================"

          sha256sum "$PKG_PATH" \
            > "${PKG_PATH}.sha256"

          cat "${PKG_PATH}.sha256"

          # --------------------------------------------------------
          # Prepare GitHub release
          # --------------------------------------------------------

          RELEASE_DIR="/home/builder/release"

          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"

          cp "$PKG_PATH" \
            "$RELEASE_DIR/"

          cp "${PKG_PATH}.sha256" \
            "$RELEASE_DIR/"

          VERSION="$(
            basename "$PKG_PATH" |
            sed -E \
              's/^dms-shell-git-(.*)-x86_64\.pkg\.tar\.zst$/\1/'
          )"

          echo
          echo "============================================================"
          echo " RELEASE"
          echo "============================================================"

          echo "Package version: $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          ls -lh "$RELEASE_DIR"

      # ============================================================
      # GitHub Release
      # ============================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.verify.outputs.version }}-v3

          name: dms-shell-git ${{ steps.verify.outputs.version }} (x86-64-v3 / Zen 3)

          body: |
            ## DankMaterialShell Git Build

            Automated Arch Linux package built from the latest `master`.

            ### Build configuration

            - Architecture: `x86_64`
            - Go target: `GOAMD64=v3`
            - CPU tuning: `znver3`
            - CGO: enabled
            - PIE: enabled
            - Quickshell UI: embedded
            - Package format: `.pkg.tar.zst`

            ### Installation

            ```bash
            sudo pacman -U dms-shell-git-*.pkg.tar.zst
            ```

            ### Compatibility

            This package requires an x86-64-v3 capable CPU
            and is specifically tuned for AMD Zen 3 (`znver3`).

          files: |
            /home/builder/release/*.pkg.tar.zst
            /home/builder/release/*.sha256

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
