name: Build Dux Shell - Zen 3

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if a release for the current upstream commit exists"
        type: boolean
        default: false
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: dux-shell-zen3-release
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/duxlabs-dev/dux-shell.git
  GO_MIN_VERSION: "1.27.1"

jobs:
  check:
    name: Resolve upstream and skip if already released
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      short: ${{ steps.resolve.outputs.short }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - name: Resolve upstream HEAD and check for existing release
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          COMMIT="$(git ls-remote "$UPSTREAM_REPO" HEAD | awk '{print $1}')"
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "ERROR: could not resolve upstream HEAD"
            exit 1
          }

          SHORT="${COMMIT:0:8}"
          TAG="dms-${SHORT}"
          SKIP=false

          if [[ "$FORCE" != "true" ]] && \
             gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            SKIP=true
          fi

          {
            echo "commit=$COMMIT"
            echo "short=$SHORT"
            echo "skip=$SKIP"
          } >> "$GITHUB_OUTPUT"
          echo "Upstream: $COMMIT | Tag: $TAG \vert{} Skip:$SKIP"

  build:
    name: Build Arch package (Zen 3 / 5600GT)
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    env:
      UPSTREAM_COMMIT: ${{ needs.check.outputs.commit }}
      UPSTREAM_SHORT: ${{ needs.check.outputs.short }}

    steps:
      - name: Update base system and install build tools
        shell: bash
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --noprogressbar
          pacman -S --needed --noconfirm --noprogressbar \
            base-devel git go make binutils libarchive file zstd

          echo "Installed toolchain:"
          go version
          git --version
          make --version | head -n 1

          GO_VERSION="$(go version | awk '{print $3}' | sed 's/^go//')"
          if [[ "$(printf '\%s\n' "$GO_MIN_VERSION" "$GO_VERSION" \vert{} sort -V \vert{} head -n 1)" != "$GO_MIN_VERSION" ]]; then
            echo "ERROR: Dux Shell 2.x requires Go ${GO_MIN_VERSION} or newer; found${GO_VERSION}."
            exit 1
          fi

          useradd -m builder
          install -d -o builder -g builder \
            /home/builder/dms-build \
            /home/builder/go/pkg/mod \
            /home/builder/.cache/go-build

      - name: Cache Go module and build caches
        uses: actions/cache@v4
        with:
          path: |
            /home/builder/go/pkg/mod
            /home/builder/.cache/go-build
          key: dms-go-zen3-${{ needs.check.outputs.commit }}
          restore-keys: |
            dms-go-zen3-

      - name: Pre-clone upstream and generate PKGBUILD for Dux Shell 2.x
        shell: bash
        run: |
          set -euo pipefail

          # Shallow blobless clone: preserves commit/tag graph for pkgver() without historical blobs
          git clone --filter=blob:none --no-checkout "$UPSTREAM_REPO" /home/builder/dms-build/src/dux-shell
