name: Build Dux Shell - Zen 3

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if a release for the current upstream commit exists"
        type: boolean
        default: false
  schedule:
    #- cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: dux-shell-zen3-release
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/duxlabs-dev/dux-shell.git
  GO_MIN_VERSION: "1.27.1"

jobs:
  check:
    name: Resolve upstream and skip if already released
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
      short: ${{ steps.resolve.outputs.short }}
      skip: ${{ steps.resolve.outputs.skip }}
    steps:
      - name: Resolve upstream HEAD and check for existing release
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          COMMIT="$(git ls-remote "$UPSTREAM_REPO" HEAD | awk '{print $1}')"
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "ERROR: could not resolve upstream HEAD"
            exit 1
          }

          SHORT="${COMMIT:0:8}"
          TAG="dms-${SHORT}"
          SKIP=false

          if [[ "$FORCE" != "true" ]] && \
             gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            SKIP=true
          fi

          {
            echo "commit=$COMMIT"
            echo "short=$SHORT"
            echo "skip=$SKIP"
          } >> "$GITHUB_OUTPUT"
          echo "Upstream: $COMMIT | Tag: $TAG | Skip: $SKIP"

  build:
    name: Build Arch package (Zen 3 / 5600GT)
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    env:
      UPSTREAM_COMMIT: ${{ needs.check.outputs.commit }}
      UPSTREAM_SHORT: ${{ needs.check.outputs.short }}

    steps:
      - name: Update base system and install build tools
        shell: bash
        run: |
          set -euo pipefail
          pacman -Sy --noconfirm --noprogressbar archlinux-keyring
          pacman -Syu --noconfirm --noprogressbar
          pacman -S --needed --noconfirm --noprogressbar \
            base-devel git go python

          echo "Installed toolchain:"
          go version
          git --version
          make --version | head -n 1

          # Strip Arch's "-X:nodwarf5" experiment suffix before comparing
          GO_VERSION="$(go env GOVERSION | sed -E 's/^go([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/')"
          if (( $(vercmp "$GO_VERSION" "$GO_MIN_VERSION") < 0 )); then
            echo "ERROR: Dux Shell 2.x requires Go ${GO_MIN_VERSION} or newer; found ${GO_VERSION}."
            exit 1
          fi
          echo "Verified Go version: ${GO_VERSION} (>= ${GO_MIN_VERSION})"

          useradd -m builder
          install -d -o builder -g builder \
            /home/builder/dms-build \
            /home/builder/go/pkg/mod \
            /home/builder/.cache/go-build

      - name: Cache Go module and build caches
        uses: actions/cache@v4
        with:
          path: |
            /home/builder/go/pkg/mod
            /home/builder/.cache/go-build
          key: dms-go-zen3-${{ needs.check.outputs.short }}
          restore-keys: |
            dms-go-zen3-

      - name: Pre-clone upstream, patch clipboard popout, and generate PKGBUILD
        shell: bash
        run: |
          set -euo pipefail

          git clone --filter=blob:none --no-checkout "$UPSTREAM_REPO" /home/builder/dms-build/src/dux-shell
          git -C /home/builder/dms-build/src/dux-shell checkout --detach "$UPSTREAM_COMMIT"
          git -C /home/builder/dms-build/src/dux-shell submodule update --init --recursive --depth 1

          # Patch bar clipboard popout race before make sync-shell embeds quickshell/
          python3 - /home/builder/dms-build/src/dux-shell <<'PYEOF'
          import os, sys

          repo = sys.argv[1]
          path = os.path.join(repo, "quickshell", "Modals", "Clipboard", "ClipboardHistoryPopout.qml")
          if not os.path.isfile(path):
              sys.exit(f"ERROR: {path} not found")

          with open(path, "r", encoding="utf-8") as f:
              src = f.read()

          old = (
              "    onShouldBeVisibleChanged: {\n"
              "        if (!shouldBeVisible) {\n"
              "            releaseTextInputFocus();\n"
              "            return;\n"
              "        }\n"
              "        if (clipboardAvailable) {\n"
              "            if (Theme.isConnectedEffect) {\n"
              "                Qt.callLater(() => {\n"
              "                    if (root.shouldBeVisible) {\n"
              "                        ClipboardService.refresh();\n"
              "                    }\n"
              "                });\n"
              "            } else {\n"
              "                ClipboardService.refresh();\n"
              "            }\n"
              "        }\n"
              "        Qt.callLater(function () {\n"
              "            if (contentLoader.item) {\n"
              "                contentLoader.item.activeTab = activeTab;\n"
              "                contentLoader.item.resetState();\n"
              "            }\n"
              "            if (contentLoader.item?.searchField) {\n"
              "                contentLoader.item.searchField.text = \"\";\n"
              "                contentLoader.item.searchField.forceActiveFocus();\n"
              "            }\n"
              "        });\n"
              "    }"
          )

          new = (
              "    onShouldBeVisibleChanged: {\n"
              "        if (!shouldBeVisible) {\n"
              "            releaseTextInputFocus();\n"
              "            return;\n"
              "        }\n"
              "        Qt.callLater(function () {\n"
              "            if (!root.shouldBeVisible) {\n"
              "                return;\n"
              "            }\n"
              "            if (contentLoader.item) {\n"
              "                contentLoader.item.activeTab = activeTab;\n"
              "                contentLoader.item.resetState();\n"
              "            }\n"
              "            if (root.clipboardAvailable) {\n"
              "                ClipboardService.refresh();\n"
              "            }\n"
              "            if (contentLoader.item?.searchField) {\n"
              "                contentLoader.item.searchField.text = \"\";\n"
              "                contentLoader.item.searchField.forceActiveFocus();\n"
              "            }\n"
              "        });\n"
              "    }"
          )

          if old in src:
              with open(path, "w", encoding="utf-8") as f:
                  f.write(src.replace(old, new, 1))
              print(f"Patched {path} successfully")
          elif new in src:
              print(f"Upstream already contains the fix in {path}; skipping patch")
          else:
              sys.exit(f"ERROR: Target block not found in {path} (upstream changed; review ClipboardHistoryPopout.qml)")
          PYEOF

          cat > /home/builder/.makepkg.conf <<'EOF'
          PACKAGER="Ravi Kishor <github@ravi>"
          MAKEFLAGS="-j$(nproc)"
          COMPRESSZST=(zstd -c -T0 --ultra -20 -)
          PKGEXT='.pkg.tar.zst'
          EOF

          cat > /home/builder/dms-build/PKGBUILD <<'PKGBUILD'
          pkgname=dux-shell
          pkgver=0
          pkgrel=1
          pkgdesc='Dux Shell - Desktop shell for Wayland compositors built with dux-qt-base and Go (Zen 3 / 5600GT)'
          arch=('x86_64')
          url='https://github.com/duxlabs-dev/dux-shell'
          license=('MIT')

          depends=('dux-qt-base')
          optdepends=(
            'dux-gop: system telemetry for resource widgets'
            'dux-calendar: calendar integration'
            'dux-search: filesystem search integration'
            'cava: audio visualizer'
            'i2c-tools: external monitor brightness control'
            'matugen: dynamic wallpaper-based theming'
            'qt6-multimedia: sound effects'
            'power-profiles-daemon: power profile control'
            'qt6ct: Qt6 application theming'
            'accountsservice: user account details'
            'cups-pk-helper: printer management'
          )
          makedepends=('git' 'go' 'make')
          provides=('dms-shell' 'dms-git' 'dms-shell-git')
          conflicts=('dms-shell' 'dms-git' 'dms-shell-git')

          # Pure Go binary (CGO_ENABLED=0): -ldflags="-s -w" strips symbols/DWARF;
          # !strip protects Go buildinfo, and !lto avoids C/C++ LTO flags.
          options=('!debug' '!lto' '!strip')

          _repo_name="dux-shell"

          pkgver() {
            cd "$srcdir/$_repo_name"
            local desc
            if desc="$(git describe --long --tags --match='v*' 2>/dev/null)"; then
              printf '%s' "$desc" | sed 's/^v//;s/-\([0-9]*\)-g/.r\1.g/;s/-/./g'
            else
              printf '0.r%s.g%s' "$(git rev-list --count HEAD)" "$(git rev-parse --short=7 HEAD)"
            fi
          }

          build() {
            local root="$srcdir/$_repo_name"
            cd "$root/core"

            export GOAMD64=v3
            export CGO_ENABLED=0
            export GOTOOLCHAIN=local
            export GOFLAGS='-trimpath'
            export GOMAXPROCS="$(nproc)"

            # Upstream core Makefile embeds the QML shell via this target.
            make sync-shell
            [[ -d internal/shellembed/dist ]] || {
              error "Embedded shell directory missing after make sync-shell"
            }

            local pgo_status="inactive (no cmd/dms/default.pgo)"
            if [[ -s cmd/dms/default.pgo ]]; then
              pgo_status="active (cmd/dms/default.pgo)"
            fi
            msg2 "PGO status: ${pgo_status}"

            local version build_time commit go_ldflags
            version="$(git -C "$root" describe --tags --always 2>/dev/null || echo dev)"
            build_time="$(git -C "$root" show -s --format='%cI' HEAD)"
            commit="$(git -C "$root" rev-parse --short=8 HEAD)"
            go_ldflags="-s -w -X main.Version=${version} -X main.buildTime=${build_time} -X main.commit=${commit}"

            go build \
              -tags 'distro_binary withshell' \
              -pgo=auto \
              -ldflags "$go_ldflags" \
              -buildmode=pie \
              -mod=readonly \
              -modcacherw \
              -o dms \
              ./cmd/dms

            local info="$srcdir/build-info.txt"
            {
              echo "repository=${url}"
              echo "commit=$(git -C "$root" rev-parse HEAD)"
              echo "commit_date=${build_time}"
              echo "go_version=$(go version)"
              echo "goamd64=${GOAMD64}"
              echo "cgo_enabled=${CGO_ENABLED}"
              echo "pgo_status=${pgo_status}"
              echo "build_tags=distro_binary withshell"
            } > "$info"
          }

          package() {
            local root="$srcdir/$_repo_name"
            local desktop

            install -Dm0755 "$root/core/dms" "$pkgdir/usr/bin/dms"
            install -Dm0644 "$srcdir/build-info.txt" \
              "$pkgdir/usr/share/doc/$pkgname/build-info.txt"
            install -Dm0644 "$root/README.md" \
              "$pkgdir/usr/share/doc/$pkgname/README.md"
            install -Dm0644 "$root/LICENSE" \
              "$pkgdir/usr/share/licenses/$pkgname/LICENSE"

            if [[ -f "$root/assets/systemd/dms.service" ]]; then
              install -Dm0644 "$root/assets/systemd/dms.service" \
                "$pkgdir/usr/lib/systemd/user/dms.service"

              # Drop-in runtime tuning for Zen 3 / 5600GT (Vega 7 / 144 Hz):
              # - Balanced Go GC (avoids GC CPU thrashing while keeping heap compact)
              # - 4-thread Go scheduler cap to reduce P/mcache overhead
              # - glibc arena & trim tuning inherited by dux-qt-base / Qt6 / Mesa
              # - Threaded Qt Quick scene graph for 144 Hz radeonsi rendering
              # - Suppress noisy Qt debug/QPA journal logging
              install -d "$pkgdir/usr/lib/systemd/user/dms.service.d"
              printf '%s\n' \
                '[Service]' \
                'Environment="GOGC=75" "GOMEMLIMIT=128MiB" "GOMAXPROCS=4"' \
                'Environment="GLIBC_TUNABLES=glibc.malloc.arena_max=2:glibc.malloc.trim_threshold=65536:glibc.malloc.mmap_threshold=65536"' \
                'Environment="QSG_RENDER_LOOP=threaded"' \
                'Environment="QT_LOGGING_RULES=*.debug=false;qt.qpa.*=false"' \
                > "$pkgdir/usr/lib/systemd/user/dms.service.d/10-zen3-tuning.conf"
              chmod 0644 "$pkgdir/usr/lib/systemd/user/dms.service.d/10-zen3-tuning.conf"
            else
              error "Required upstream service missing: assets/systemd/dms.service"
            fi

            install -d "$pkgdir/usr/share/applications"
            for desktop in \
              dms-open.desktop \
              dev.duxlabs.shell.desktop \
              dev.duxlabs.shell.notepad.desktop
            do
              if [[ -s "$root/assets/$desktop" ]]; then
                install -Dm0644 "$root/assets/$desktop" \
                  "$pkgdir/usr/share/applications/$desktop"
              elif [[ "$desktop" == "dms-open.desktop" ]]; then
                error "Required desktop entry missing: assets/$desktop"
              else
                echo "INFO: optional desktop entry absent: assets/$desktop"
              fi
            done

            if [[ -s "$root/assets/dev.duxlabs.shell.svg" ]]; then
              install -Dm0644 "$root/assets/dev.duxlabs.shell.svg" \
                "$pkgdir/usr/share/icons/hicolor/scalable/apps/dev.duxlabs.shell.svg"
            else
              error "Required upstream icon missing: assets/dev.duxlabs.shell.svg"
            fi

            install -d "$pkgdir/usr/share/bash-completion/completions" \
              "$pkgdir/usr/share/zsh/site-functions" \
              "$pkgdir/usr/share/fish/vendor_completions.d"

            "$root/core/dms" completion bash \
              > "$pkgdir/usr/share/bash-completion/completions/dms"
            "$root/core/dms" completion zsh \
              > "$pkgdir/usr/share/zsh/site-functions/_dms"
            "$root/core/dms" completion fish \
              > "$pkgdir/usr/share/fish/vendor_completions.d/dms.fish"

            for comp in \
              "$pkgdir/usr/share/bash-completion/completions/dms" \
              "$pkgdir/usr/share/zsh/site-functions/_dms" \
              "$pkgdir/usr/share/fish/vendor_completions.d/dms.fish"
            do
              [[ -s "$comp" ]] || error "Completion generation produced an empty file: $comp"
            done
          }
          PKGBUILD

          chown -R builder:builder /home/builder

      - name: Build Arch package
        shell: bash
        run: |
          set -euo pipefail
          su - builder -c '
            set -euo pipefail
            cd /home/builder/dms-build
            export GOPATH="/home/builder/go"
            export GOMODCACHE="/home/builder/go/pkg/mod"
            export GOCACHE="/home/builder/.cache/go-build"
            export GOAMD64=v3
            export GOTOOLCHAIN=local
            makepkg --nodeps --noextract --clean --noconfirm
          '

      - name: Verify package and prepare release
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR=/home/builder/dms-build

          PKG_PATH="$(find "$BUILD_DIR" -maxdepth 1 -type f \
            -name 'dux-shell-*.pkg.tar.zst' \
            ! -name 'dux-shell-debug-*' -print -quit)"

          if [[ -z "$PKG_PATH" ]]; then
            echo "ERROR: Main package not found."
            ls -lah "$BUILD_DIR"
            exit 1
          fi

          echo "Package: $PKG_PATH"
          pacman -Qip "$PKG_PATH"
          bsdtar -tf "$PKG_PATH" > /tmp/package-contents.txt

          for required in \
            'usr/bin/dms' \
            'usr/share/doc/dux-shell/build-info.txt' \
            'usr/lib/systemd/user/dms.service' \
            'usr/lib/systemd/user/dms.service.d/10-zen3-tuning.conf' \
            'usr/share/icons/hicolor/scalable/apps/dev.duxlabs.shell.svg'
          do
            grep -qx "$required" /tmp/package-contents.txt || {
              echo "ERROR: Required package path missing: $required"
              exit 1
            }
          done

          if grep -q '^usr/share/quickshell/' /tmp/package-contents.txt; then
            echo "ERROR: Unexpected separate Quickshell UI payload; DMS 2.x embeds the shell."
            exit 1
          fi

          VERIFY_DIR=/home/builder/package-check
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          bsdtar -xf "$PKG_PATH" -C "$VERIFY_DIR"
          DMS="$VERIFY_DIR/usr/bin/dms"

          echo "Build info:"
          cat "$VERIFY_DIR/usr/share/doc/dux-shell/build-info.txt"

          echo "Systemd drop-in tuning:"
          cat "$VERIFY_DIR/usr/lib/systemd/user/dms.service.d/10-zen3-tuning.conf"

          file "$DMS"
          ls -lh "$DMS"
          go version -m "$DMS" | grep -E \
            'path|build|CGO_ENABLED|GOARCH|GOAMD64|GOOS|tags|trimpath|vcs.revision|vcs.time' || true

          go version -m "$DMS" | grep -q 'GOAMD64=v3' || {
            echo "ERROR: Binary is not GOAMD64=v3."
            exit 1
          }

          readelf -h "$DMS" | grep -E 'Type:|Machine:|OS/ABI:'
          readelf -h "$DMS" | grep -Eq 'Type:[[:space:]]+DYN' || {
            echo "ERROR: Expected a PIE (ELF DYN) executable."
            exit 1
          }

          COMMIT="$(sed -n 's/^commit=//p' \
            "$VERIFY_DIR/usr/share/doc/dux-shell/build-info.txt")"

          [[ "$COMMIT" == "$UPSTREAM_COMMIT" ]] || {
            echo "ERROR: built commit $COMMIT does not match expected $UPSTREAM_COMMIT"
            exit 1
          }

          sha256sum "$DMS"
          sha256sum "$PKG_PATH" > "${PKG_PATH}.sha256"

          RELEASE_DIR=/home/builder/release
          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"
          cp "$PKG_PATH" "${PKG_PATH}.sha256" "$RELEASE_DIR/"

          VERSION="$(basename "$PKG_PATH" | sed -E \
            's/^dux-shell-(.*)-x86_64\.pkg\.tar\.zst$/\1/')"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -lh "$RELEASE_DIR"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dms-${{ needs.check.outputs.short }}
          name: dux-shell ${{ steps.verify.outputs.version }} (Zen 3)
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            ## Dux Shell - Arch Linux Package

            Built from upstream commit `${{ needs.check.outputs.commit }}`.

            ### Build configuration
            - Architecture: `x86_64`
            - CPU target: `GOAMD64=v3` (x86-64-v3, Zen 3 / Cezanne class, e.g. Ryzen 5 5600GT)
            - Runtime dependency: `dux-qt-base` (`libdux-qt-base.so`)
            - Minimum Go toolchain: `1.27.1`
            - CGO: disabled, matching upstream's core build
            - PIE: enabled (`-pgo=auto`)
            - UI: embedded from upstream `quickshell/` using `make sync-shell` (with `ClipboardHistoryPopout.qml` reset-before-refresh patch)
            - Runtime drop-in (`10-zen3-tuning.conf`): `GOGC=75`, `GOMEMLIMIT=128MiB`, `GOMAXPROCS=4`, `GLIBC_TUNABLES` (2 arenas / 64 KB trim & mmap), `QSG_RENDER_LOOP=threaded`, quiet Qt debug logging
            - Source repository: `https://github.com/duxlabs-dev/dux-shell`
            - Arch package name: `dux-shell`
            - Package format: `.pkg.tar.zst` (`zstd --ultra -20`)

            ### Installation
            ```bash
            sudo pacman -U dux-shell-*.pkg.tar.zst
            ```

            ### Compatibility
            Requires an x86-64-v3-capable CPU (AVX2, BMI2, FMA) and `dux-qt-base` installed.
          files: |
            /home/builder/release/*.pkg.tar.zst
            /home/builder/release/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
