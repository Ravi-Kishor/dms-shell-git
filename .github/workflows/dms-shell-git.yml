name: Build dms-shell-git (latest upstream / Zen 3)

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: dms-shell-git-zen3-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Update base system
        shell: bash
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            base-devel git go make curl binutils libarchive sudo \
            quickshell accountsservice ccache findutils file

      - name: Create builder user
        shell: bash
        run: |
          set -euo pipefail
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          install -d -o builder -g builder /home/builder/dms-build
          install -d -o builder -g builder /home/builder/.ccache

      - name: Generate PKGBUILD
        shell: bash
        run: |
          set -euo pipefail
          cat > /home/builder/dms-build/PKGBUILD <<'PKGBUILD'
          pkgname=dms-shell-git
          pkgver=0
          pkgrel=1
          pkgdesc='Desktop shell for Wayland compositors built with Quickshell and Go'
          arch=('x86_64')
          url='https://github.com/AvengeMedia/DankMaterialShell'
          license=('MIT')

          # dgop is optional upstream; add it here only if you want it installed
          # by default for DMS system-telemetry widgets.
          depends=('quickshell' 'accountsservice')
          optdepends=(
            'dgop: System telemetry for resource widgets'
            'cava: Audio visualizer'
            'dankcalendar: Calendar app integration'
            'i2c-tools: External monitor brightness control'
            'dsearch: Filesystem search engine'
            'matugen: Dynamic wallpaper-based theming'
            'qt6-multimedia: Sound effect support'
            'power-profiles-daemon: Set power profile'
            'qt6ct: Qt6 application theming'
            'cups-pk-helper: Printer management'
          )
          makedepends=('git' 'go' 'make')
          provides=('dms-shell' 'dms-git')
          conflicts=('dms-shell' 'dms-git')

          source=('git+https://github.com/AvengeMedia/DankMaterialShell.git')
          sha256sums=('SKIP')

          pkgver() {
            cd "$srcdir/DankMaterialShell"
            local desc
            desc="$(git describe --long --tags --match='v*' HEAD 2>/dev/null || true)"
            if [[ -n "$desc" ]]; then
              printf '%s\n' "$desc" |
                sed 's/^v//;s/\([^-]*-g\)/r\1/;s/-/./g'
            else
              printf '0.0.0.r0.%s' "$(git rev-parse --short=7 HEAD)"
            fi
          }

          prepare() {
            cd "$srcdir/DankMaterialShell"
            git submodule sync
            git submodule update --init --recursive
          }

          build() {
            cd "$srcdir/DankMaterialShell/core"

            export GOAMD64=v3
            export CGO_ENABLED=1
            export CFLAGS="-march=znver3 -mtune=znver3 -O3 -pipe -fno-plt -fomit-frame-pointer -flto=auto"
            export CXXFLAGS="$CFLAGS"
            export CPPFLAGS="$CFLAGS"
            export LDFLAGS="-Wl,-O3,--as-needed"
            export CGO_CPPFLAGS="$CPPFLAGS"
            export CGO_CFLAGS="$CFLAGS"
            export CGO_CXXFLAGS="$CXXFLAGS"
            export CGO_LDFLAGS="$LDFLAGS"

            local version build_time commit go_ldflags
            local pgo_flag=()
            version="$(git describe --tags --always 2>/dev/null || echo dev)"
            build_time="$(git show -s --format='%cI' HEAD 2>/dev/null || date -u '+%Y-%m-%dT%H:%M:%SZ')"
            commit="$(git rev-parse --short=8 HEAD 2>/dev/null || echo unknown)"
            go_ldflags="-s -w -X main.Version=${version} -X main.buildTime=${build_time} -X main.commit=${commit} -linkmode=external -extldflags=-Wl,-O3,--as-needed"

            # DMS 1.6+ embeds the Quickshell UI. Fail loudly if upstream removes
            # or renames the expected sync target; do not silently skip it.
            make sync-shell

            if [[ -f default.pgo ]]; then
              pgo_flag=(-pgo=default.pgo)
            fi

            go build \
              -tags 'distro_binary withshell' \
              -ldflags "$go_ldflags" \
              -buildmode=pie \
              -trimpath \
              -mod=readonly \
              -modcacherw \
              "${pgo_flag[@]}" \
              -o dms \
              ./cmd/dms

            # Record the exact source commit and build configuration in the
            # package for diagnostics and reproducibility.
            install -Dm0644 <(printf '%s\n' \
              "repository=https://github.com/AvengeMedia/DankMaterialShell" \
              "commit=$(git rev-parse HEAD)" \
              "commit_date=$(git show -s --format=%cI HEAD)" \
              "goamd64=$GOAMD64" \
              "cflags=$CFLAGS") \
              "$srcdir/build-info.txt"
          }

          package() {
            local root="$srcdir/DankMaterialShell"
            local desktop icon
            install -Dm0755 "$root/core/dms" "$pkgdir/usr/bin/dms"
            install -Dm0644 "$srcdir/build-info.txt" \
              "$pkgdir/usr/share/doc/$pkgname/build-info.txt"
            install -Dm0644 "$root/README.md" \
              "$pkgdir/usr/share/doc/$pkgname/README.md"
            install -Dm0644 "$root/LICENSE" \
              "$pkgdir/usr/share/licenses/$pkgname/LICENSE" 2>/dev/null || true

            # Required runtime service: fail if upstream still expects this
            # service but the checked-out source is missing it.
            if [[ -f "$root/assets/systemd/dms.service" ]]; then
              install -Dm0644 "$root/assets/systemd/dms.service" \
                "$pkgdir/usr/lib/systemd/user/dms.service"
            else
              echo "WARNING: assets/systemd/dms.service not found; verify upstream service layout."
            fi

            # Desktop entries are optional across upstream revisions.
            install -d "$pkgdir/usr/share/applications"
            for desktop in \
              dms-open.desktop \
              com.danklinux.dms.desktop \
              com.danklinux.dms.notepad.desktop
            do
              if [[ -f "$root/assets/$desktop" ]]; then
                install -Dm0644 "$root/assets/$desktop" \
                  "$pkgdir/usr/share/applications/$desktop"
              else
                echo "INFO: optional desktop entry absent: assets/$desktop"
              fi
            done

            # Install a known icon if present.
            if [[ -f "$root/core/assets/danklogo.svg" ]]; then
              install -Dm0644 "$root/core/assets/danklogo.svg" \
                "$pkgdir/usr/share/icons/hicolor/scalable/apps/danklogo.svg"
            elif [[ -f "$root/assets/com.danklinux.dms.svg" ]]; then
              install -Dm0644 "$root/assets/com.danklinux.dms.svg" \
                "$pkgdir/usr/share/icons/hicolor/scalable/apps/com.danklinux.dms.svg"
            else
              echo "WARNING: no known DMS SVG icon found; inspect upstream asset layout."
            fi

            # Completions are taken from the same checked-out revision if
            # available in the repository. Do not fabricate empty files.
            local src completion_dest
            for src in \
              "$root/completion.bash" \
              "$root/assets/completion.bash" \
              "$root/completions/completion.bash"
            do
              if [[ -s "$src" ]]; then
                install -Dm0644 "$src" \
                  "$pkgdir/usr/share/bash-completion/completions/dms"
                break
              fi
            done
            for src in \
              "$root/completion.fish" \
              "$root/assets/completion.fish" \
              "$root/completions/completion.fish"
            do
              if [[ -s "$src" ]]; then
                install -Dm0644 "$src" \
                  "$pkgdir/usr/share/fish/vendor_completions.d/dms.fish"
                break
              fi
            done
            for src in \
              "$root/completion.zsh" \
              "$root/assets/completion.zsh" \
              "$root/completions/completion.zsh"
            do
              if [[ -s "$src" ]]; then
                install -Dm0644 "$src" \
                  "$pkgdir/usr/share/zsh/site-functions/_dms"
                break
              fi
            done

            if [[ -d "$root/docs" ]]; then
              install -d "$pkgdir/usr/share/doc/$pkgname/docs"
              cp -a "$root/docs/." "$pkgdir/usr/share/doc/$pkgname/docs/"
            fi
          }
          PKGBUILD

          chown builder:builder /home/builder/dms-build/PKGBUILD

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /home/builder/.ccache
          key: dms-ccache-zen3-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            dms-ccache-zen3-${{ runner.os }}-

      - name: Build Arch package
        shell: bash
        run: |
          set -euo pipefail
          chown -R builder:builder /home/builder/.ccache
          su builder -s /bin/bash -c '
            set -euo pipefail
            cd /home/builder/dms-build
            export MAKEFLAGS="-j$(nproc)"
            export CCACHE_DIR="/home/builder/.ccache"
            export PATH="/usr/lib/ccache/bin:$PATH"
            ccache --zero-stats || true
            makepkg --syncdeps --cleanbuild --clean --noconfirm
            ccache --show-stats || true
          '

      - name: Verify package and prepare release
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR=/home/builder/dms-build
          PKG_PATH="$(find "$BUILD_DIR" -maxdepth 1 -type f \
            -name 'dms-shell-git-*.pkg.tar.zst' \
            ! -name 'dms-shell-git-debug-*' -print -quit)"
          if [[ -z "$PKG_PATH" ]]; then
            echo "ERROR: Main package not found."
            ls -lah "$BUILD_DIR"
            exit 1
          fi

          echo "Package: $PKG_PATH"
          pacman -Qip "$PKG_PATH"
          bsdtar -tf "$PKG_PATH" > /tmp/package-contents.txt
          grep -qx 'usr/bin/dms' /tmp/package-contents.txt || {
            echo "ERROR: usr/bin/dms missing from package."
            exit 1
          }
          grep -qx 'usr/share/doc/dms-shell-git/build-info.txt' /tmp/package-contents.txt || {
            echo "ERROR: build-info.txt missing from package."
            exit 1
          }
          if grep -q '^usr/share/quickshell/' /tmp/package-contents.txt; then
            echo "ERROR: Unexpected separate /usr/share/quickshell payload."
            exit 1
          fi

          VERIFY_DIR=/home/builder/package-check
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          bsdtar -xf "$PKG_PATH" -C "$VERIFY_DIR"
          DMS="$VERIFY_DIR/usr/bin/dms"

          file "$DMS"
          go version -m "$DMS" | grep -E \
            'path|build|CGO_ENABLED|GOARCH|GOAMD64|GOOS|tags|trimpath|vcs.revision|vcs.time' || true
          go version -m "$DMS" | grep -q 'GOAMD64=v3' || {
            echo "ERROR: Binary is not GOAMD64=v3."
            exit 1
          }
          readelf -h "$DMS" | grep -E 'Type:|Machine:|OS/ABI:'
          readelf -d "$DMS" | grep NEEDED || true
          readelf -d "$DMS" | grep -q 'libc.so.6' || {
            echo "ERROR: Expected libc.so.6 dependency not found."
            exit 1
          }

          COMMIT="$(sed -n 's/^commit=//p' \
            "$VERIFY_DIR/usr/share/doc/dms-shell-git/build-info.txt")"
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "ERROR: Invalid source commit in build-info.txt."
            exit 1
          }
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

          sha256sum "$DMS"
          sha256sum "$PKG_PATH" > "${PKG_PATH}.sha256"

          RELEASE_DIR=/home/builder/release
          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"
          cp "$PKG_PATH" "${PKG_PATH}.sha256" "$RELEASE_DIR/"

          VERSION="$(basename "$PKG_PATH" | sed -E \
            's/^dms-shell-git-(.*)-x86_64\.pkg\.tar\.zst$/\1/')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -lh "$RELEASE_DIR"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dms-${{ steps.verify.outputs.commit }}
          name: dms-shell-git ${{ steps.verify.outputs.version }} (Zen 3 / x86-64-v3)
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            ## DankMaterialShell Git Build

            Built from upstream commit `${{ steps.verify.outputs.commit }}`.

            ### Build configuration
            - Architecture: `x86_64`
            - CPU tuning: AMD Zen 3 (`-march=znver3 -mtune=znver3`)
            - Go target: `GOAMD64=v3`
            - CGO: enabled
            - PIE: enabled
            - C optimization: `-O3`
            - LTO: enabled for compatible native compilation stages
            - DMS UI: embedded with upstream `make sync-shell`
            - Package format: Arch Linux `.pkg.tar.zst`

            ### Installation
            ```bash
            sudo pacman -U dms-shell-git-*.pkg.tar.zst
            ```

            ### Compatibility
            Requires an x86-64-v3-capable CPU; native compiler tuning targets AMD Zen 3.
          files: |
            /home/builder/release/*.pkg.tar.zst
            /home/builder/release/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}