name: Build dms-shell-git (Zen 3 / x86-64-v3)

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:

      # ============================================================
      # System
      # ============================================================

      - name: Update base system
        run: |
          set -euo pipefail

          pacman -Syu --noconfirm

          pacman -S --needed --noconfirm \
            base-devel \
            git \
            go \
            make \
            curl \
            binutils \
            libarchive \
            sudo \
            quickshell \
            dgop \
            accountsservice \
            ccache

      # ============================================================
      # Builder
      # ============================================================

      - name: Create builder user
        run: |
          set -euo pipefail

          useradd -m builder

          echo "builder ALL=(ALL) NOPASSWD: ALL" \
            >> /etc/sudoers

          mkdir -p /home/builder/dms-build
          mkdir -p /home/builder/.ccache

          chown -R builder:builder /home/builder

      # ============================================================
      # Generate PKGBUILD
      # ============================================================

      - name: Generate PKGBUILD
        run: |
          set -euo pipefail

          cat > /home/builder/dms-build/PKGBUILD <<'EOF'
          pkgname=dms-shell-git
          pkgver=0
          pkgrel=1

          pkgdesc='Desktop shell for Wayland compositors built with Quickshell & Go'

          arch=(x86_64)

          url='https://github.com/AvengeMedia/DankMaterialShell'

          license=(MIT)

          depends=(
            dgop
            quickshell
            accountsservice
          )

          optdepends=(
            'cava: Audio visualizer'
            'i2c-tools: External monitor brightness control'
            'matugen: Dynamic wallpaper-based theming'
            'qt6-multimedia: Sound effect support'
            'power-profiles-daemon: Set power profile'
            'qt6ct: Qt6 application theming'
            'cups-pk-helper: Printer Management'
            'greetd-dms-greeter: DMS Greeter'
          )

          makedepends=(
            git
            go
            make
          )

          provides=(
            dms-shell=$pkgver
            dms-git
          )

          conflicts=(
            dms-shell
            dms-git
          )

          source=(
            'git+https://github.com/AvengeMedia/DankMaterialShell.git'
            'https://github.com/AvengeMedia/DankMaterialShell/releases/download/v1.5.0/completion.bash'
            'https://github.com/AvengeMedia/DankMaterialShell/releases/download/v1.5.0/completion.fish'
            'https://github.com/AvengeMedia/DankMaterialShell/releases/download/v1.5.0/completion.zsh'
          )

          sha256sums=(
            'SKIP'
            'SKIP'
            'SKIP'
            'SKIP'
          )

          pkgver() {
              cd DankMaterialShell

              git describe \
                  --long \
                  --tags \
                  --abbrev=7 \
                  --match='v*' \
                  HEAD 2>/dev/null |
                  sed 's/^v//;s/\([^-]*-g\)/r\1/;s/-/./g' ||
                  echo "0.0.0.r0.$(git rev-parse --short=7 HEAD)"
          }

          prepare() {
              cd DankMaterialShell

              git submodule sync
              git submodule update --init --recursive
          }

          build() {
              cd DankMaterialShell/core

              # ======================================================
              # Target CPU
              # ======================================================

              export GOAMD64=v3
              export CGO_ENABLED=1

              export CFLAGS="-march=znver3 -O3 -pipe -fno-plt"
              export CXXFLAGS="$CFLAGS"
              export CPPFLAGS="$CFLAGS"

              export LDFLAGS="-Wl,-O2,--as-needed"

              export CGO_CPPFLAGS="$CPPFLAGS"
              export CGO_CFLAGS="$CFLAGS"
              export CGO_CXXFLAGS="$CXXFLAGS"
              export CGO_LDFLAGS="$LDFLAGS"

              # ======================================================
              # Version information
              # ======================================================

              local VERSION
              local BUILD_TIME
              local COMMIT
              local LDFLAGS_GO

              VERSION="$(git describe --tags --always 2>/dev/null || echo dev)"

              BUILD_TIME="$(
                  git show -s \
                      --format='%cI' \
                      HEAD 2>/dev/null ||
                  date -u '+%Y-%m-%dT%H:%M:%SZ'
              )"

              COMMIT="$(
                  git rev-parse --short=8 HEAD 2>/dev/null ||
                  echo unknown
              )"

              LDFLAGS_GO="-s -w \
              -X main.Version=${VERSION} \
              -X main.buildTime=${BUILD_TIME} \
              -X main.commit=${COMMIT} \
              -linkmode=external"

              # ======================================================
              # Embed DMS Quickshell UI
              # ======================================================

              make sync-shell

              # ======================================================
              # Go
              # ======================================================

              local GOFLAGS
              GOFLAGS="-buildmode=pie -trimpath -mod=readonly -modcacherw"

              local PGO_FLAG=""

              if [[ -f default.pgo ]]; then
                  echo "==> PGO profile found"
                  PGO_FLAG="-pgo=default.pgo"
              fi

              echo
              echo "============================================================"
              echo " BUILD CONFIGURATION"
              echo "============================================================"
              echo "GOAMD64      = $GOAMD64"
              echo "CGO_ENABLED  = $CGO_ENABLED"
              echo "CFLAGS       = $CFLAGS"
              echo "LDFLAGS      = $LDFLAGS"
              echo "GOFLAGS      = $GOFLAGS"
              echo "PGO          = ${PGO_FLAG:-disabled}"
              echo

              go build \
                  -tags 'distro_binary withshell' \
                  -ldflags "$LDFLAGS_GO" \
                  $GOFLAGS \
                  $PGO_FLAG \
                  -o dms \
                  ./cmd/dms
          }

          package() {

              # ======================================================
              # Main binary
              # ======================================================

              install -Dm0755 \
                  DankMaterialShell/core/dms \
                  "$pkgdir/usr/bin/dms"

              # ======================================================
              # Systemd
              # ======================================================

              install -Dm0644 \
                  DankMaterialShell/assets/systemd/dms.service \
                  "$pkgdir/usr/lib/systemd/user/dms.service"

              # ======================================================
              # Shell completions
              # ======================================================

              install -Dm0644 \
                  "$srcdir/completion.bash" \
                  "$pkgdir/usr/share/bash-completion/completions/dms"

              install -Dm0644 \
                  "$srcdir/completion.fish" \
                  "$pkgdir/usr/share/fish/vendor_completions.d/dms.fish"

              install -Dm0644 \
                  "$srcdir/completion.zsh" \
                  "$pkgdir/usr/share/zsh/site-functions/_dms"

              # ======================================================
              # Desktop files
              # ======================================================

              install -Dm0644 \
                  DankMaterialShell/assets/dms-open.desktop \
                  "$pkgdir/usr/share/applications/dms-open.desktop"

              install -Dm0644 \
                  DankMaterialShell/assets/com.danklinux.dms.desktop \
                  "$pkgdir/usr/share/applications/com.danklinux.dms.desktop"

              install -Dm0644 \
                  DankMaterialShell/assets/com.danklinux.dms.notepad.desktop \
                  "$pkgdir/usr/share/applications/com.danklinux.dms.notepad.desktop"

              # ======================================================
              # Icon
              # ======================================================

              install -Dm0644 \
                  DankMaterialShell/core/assets/danklogo.svg \
                  "$pkgdir/usr/share/icons/hicolor/scalable/apps/danklogo.svg"

              # ======================================================
              # Documentation
              # ======================================================

              install -Dm0644 \
                  DankMaterialShell/README.md \
                  "$pkgdir/usr/share/doc/$pkgname/README.md"

              if [[ -d DankMaterialShell/docs ]]; then
                  cp -r \
                      DankMaterialShell/docs/* \
                      "$pkgdir/usr/share/doc/$pkgname/"
              fi
          }
          EOF

          chown builder:builder \
            /home/builder/dms-build/PKGBUILD

      # ============================================================
      # ccache
      # ============================================================

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /home/builder/.ccache
          key: dms-ccache-zen3-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            dms-ccache-zen3-${{ runner.os }}-

      # ============================================================
      # Build
      # ============================================================

      - name: Build Arch package
        run: |
          set -euo pipefail

          chown -R builder:builder \
            /home/builder/.ccache

          su builder -c '
            set -euo pipefail

            cd /home/builder/dms-build

            export MAKEFLAGS="-j$(nproc)"
            export CCACHE_DIR="/home/builder/.ccache"
            export PATH="/usr/lib/ccache/bin:$PATH"

            ccache --zero-stats || true

            makepkg \
              --syncdeps \
              --cleanbuild \
              --clean \
              --noconfirm

            echo
            echo "============================================================"
            echo " CCACHE STATS"
            echo "============================================================"

            ccache --show-stats || true
          '

      # ============================================================
      # Verify package
      # ============================================================

      - name: Verify package
        id: verify
        run: |
          set -euo pipefail

          BUILD_DIR="/home/builder/dms-build"

          echo
          echo "============================================================"
          echo " BUILD DIRECTORY"
          echo "============================================================"

          ls -lah "$BUILD_DIR"

          # ----------------------------------------------------------
          # Locate MAIN package only
          # ----------------------------------------------------------

          PKG_PATH="$(
            find "$BUILD_DIR" \
              -maxdepth 1 \
              -type f \
              -name 'dms-shell-git-*.pkg.tar.zst' \
              ! -name 'dms-shell-git-debug-*' \
              -print -quit
          )"

          if [[ -z "$PKG_PATH" ]]; then
              echo "ERROR: Main package not found."
              exit 1
          fi

          if [[ "$(basename "$PKG_PATH")" == dms-shell-git-debug-* ]]; then
              echo "ERROR: Debug package selected."
              exit 1
          fi

          echo "PKG_PATH=$PKG_PATH"
          echo "PACKAGE=$(basename "$PKG_PATH")"

          # ----------------------------------------------------------
          # Package metadata
          # ----------------------------------------------------------

          echo
          echo "============================================================"
          echo " PACKAGE INFO"
          echo "============================================================"

          pacman -Qip "$PKG_PATH"

          echo
          echo "============================================================"
          echo " PACKAGE FILE"
          echo "============================================================"

          file "$PKG_PATH"

          echo
          echo "============================================================"
          echo " PACKAGE CONTENTS"
          echo "============================================================"

          bsdtar -tf "$PKG_PATH"

          # ----------------------------------------------------------
          # Hard check: binary exists
          # ----------------------------------------------------------

          if ! bsdtar -tf "$PKG_PATH" |
              grep -qx 'usr/bin/dms'; then

              echo "ERROR: usr/bin/dms missing from package."
              exit 1
          fi

          # ----------------------------------------------------------
          # Hard check: DMS QML tree is NOT separately packaged
          # ----------------------------------------------------------

          if bsdtar -tf "$PKG_PATH" |
              grep -q '^usr/share/quickshell/'; then

              echo "ERROR: /usr/share/quickshell payload found."
              echo "The embedded DMS UI must not be packaged separately."
              exit 1
          fi

          echo "OK: No /usr/share/quickshell payload."

          # ----------------------------------------------------------
          # Extract
          # ----------------------------------------------------------

          VERIFY_DIR="/home/builder/package-check"

          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"

          bsdtar \
            -xf "$PKG_PATH" \
            -C "$VERIFY_DIR"

          DMS="$VERIFY_DIR/usr/bin/dms"

          if [[ ! -f "$DMS" ]]; then
              echo "ERROR: extracted usr/bin/dms missing."
              exit 1
          fi

          # ----------------------------------------------------------
          # Binary
          # ----------------------------------------------------------

          echo
          echo "============================================================"
          echo " DMS BINARY"
          echo "============================================================"

          ls -lh "$DMS"
          file "$DMS"

          # ----------------------------------------------------------
          # Go build info
          # ----------------------------------------------------------

          echo
          echo "============================================================"
          echo " GO BUILD INFO"
          echo "============================================================"

          go version -m "$DMS" |
            grep -E \
              'path|build|CGO_ENABLED|GOARCH|GOAMD64|GOOS|GOEXPERIMENT|tags|trimpath|vcs.revision|vcs.time'

          # ----------------------------------------------------------
          # GOAMD64 hard check
          # ----------------------------------------------------------

          if ! go version -m "$DMS" |
              grep -q 'GOAMD64=v3'; then

              echo "ERROR: Binary is not GOAMD64=v3."
              exit 1
          fi

          echo "OK: GOAMD64=v3"

          # ----------------------------------------------------------
          # ELF
          # ----------------------------------------------------------

          echo
          echo "============================================================"
          echo " ELF"
          echo "============================================================"

          readelf -h "$DMS" |
            grep -E 'Type:|Machine:|OS/ABI:'

          # ----------------------------------------------------------
          # Dynamic libraries
          # ----------------------------------------------------------

          echo
          echo "============================================================"
          echo " DYNAMIC LIBRARIES"
          echo "============================================================"

          readelf -d "$DMS" |
            grep NEEDED || true

          # ----------------------------------------------------------
          # Ensure libc is present for the intended CGO build
          # ----------------------------------------------------------

          if ! readelf -d "$DMS" |
              grep -q 'libc.so.6'; then

              echo "ERROR: Expected libc.so.6 dependency not found."
              exit 1
          fi

          # ----------------------------------------------------------
          # SHA256
          # ----------------------------------------------------------

          echo
          echo "============================================================"
          echo " SHA256"
          echo "============================================================"

          sha256sum "$DMS"

          sha256sum "$PKG_PATH" \
            > "${PKG_PATH}.sha256"

          cat "${PKG_PATH}.sha256"

          # ----------------------------------------------------------
          # Release directory
          # ----------------------------------------------------------

          RELEASE_DIR="/home/builder/release"

          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"

          cp "$PKG_PATH" \
            "$RELEASE_DIR/"

          cp "${PKG_PATH}.sha256" \
            "$RELEASE_DIR/"

          VERSION="$(
            basename "$PKG_PATH" |
              sed -E \
                's/^dms-shell-git-(.*)-x86_64\.pkg\.tar\.zst$/\1/'
          )"

          echo
          echo "============================================================"
          echo " RELEASE"
          echo "============================================================"

          echo "Package version: $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          ls -lh "$RELEASE_DIR"

      # ============================================================
      # GitHub Release
      # ============================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.verify.outputs.version }}-v3
          name: dms-shell-git ${{ steps.verify.outputs.version }} (x86-64-v3 / Zen 3)

          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true

          body: |
            ## DankMaterialShell Git Build

            Automated Arch Linux package built from the latest `master`.

            ### Build configuration

            - Architecture: `x86_64`
            - CPU target: AMD Zen 3 (`znver3`)
            - Go target: `GOAMD64=v3`
            - CGO: enabled
            - PIE: enabled
            - Quickshell: runtime dependency
            - DMS UI: embedded into `/usr/bin/dms`
            - Separate `/usr/share/quickshell/dms`: not packaged
            - Package format: Arch Linux `.pkg.tar.zst`

            ### Installation

            ```bash
            sudo pacman -U dms-shell-git-*.pkg.tar.zst
            ```

            ### Compatibility

            This package requires an x86-64-v3 capable CPU
            and is tuned specifically for AMD Zen 3 (`znver3`).

          files: |
            /home/builder/release/*.pkg.tar.zst
            /home/builder/release/*.sha256

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}