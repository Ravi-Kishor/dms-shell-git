name: Build dms-shell-git (Zen 3 / x86-64-v3)

permissions:
  contents: write

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Update base system
        shell: bash
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            base-devel git go make curl binutils libarchive sudo \
            quickshell dgop accountsservice ccache findutils file

      - name: Create builder user
        shell: bash
        run: |
          set -euo pipefail
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          install -d -o builder -g builder /home/builder/dms-build
          install -d -o builder -g builder /home/builder/.ccache

      - name: Generate PKGBUILD
        shell: bash
        run: |
          set -euo pipefail
          cat > /home/builder/dms-build/PKGBUILD <<'PKGBUILD'
          pkgname=dms-shell-git
          pkgver=0
          pkgrel=1
          pkgdesc='Desktop shell for Wayland compositors built with Quickshell and Go'
          arch=('x86_64')
          url='https://github.com/AvengeMedia/DankMaterialShell'
          license=('MIT')

          depends=('quickshell' 'accountsservice')
          optdepends=(
            'cava: Audio visualizer'
            'i2c-tools: External monitor brightness control'
            'matugen: Dynamic wallpaper-based theming'
            'qt6-multimedia: Sound effect support'
            'power-profiles-daemon: Set power profile'
            'qt6ct: Qt6 application theming'
            'cups-pk-helper: Printer management'
            'greetd-dms-greeter: DMS greeter'
          )
          makedepends=('git' 'go' 'make')
          provides=("dms-shell=$pkgver" 'dms-git')
          conflicts=('dms-shell' 'dms-git')

          source=('git+https://github.com/AvengeMedia/DankMaterialShell.git')
          sha256sums=('SKIP')

          pkgver() {
            cd DankMaterialShell
            git describe --long --tags --abbrev=7 --match='v*' HEAD 2>/dev/null |
              sed 's/^v//;s/\([^-]*-g\)/r\1/;s/-/./g' ||
              echo "0.0.0.r0.$(git rev-parse --short=7 HEAD)"
          }

          prepare() {
            cd DankMaterialShell
            git submodule sync
            git submodule update --init --recursive
          }

          build() {
            cd "$srcdir/DankMaterialShell/core"

            export GOAMD64=v3
            export CGO_ENABLED=1
            export CFLAGS="-march=znver3 -mtune=znver3 -O3 -pipe -fno-plt -fomit-frame-pointer -flto=auto"
            export CXXFLAGS="$CFLAGS"
            export CPPFLAGS="$CFLAGS"
            export LDFLAGS="-Wl,-O3,--as-needed"
            export CGO_CPPFLAGS="$CPPFLAGS"
            export CGO_CFLAGS="$CFLAGS"
            export CGO_CXXFLAGS="$CXXFLAGS"
            export CGO_LDFLAGS="$LDFLAGS"

            local version build_time commit go_ldflags pgo_flag=()
            version="$(git describe --tags --always 2>/dev/null || echo dev)"
            build_time="$(git show -s --format='%cI' HEAD 2>/dev/null || date -u '+%Y-%m-%dT%H:%M:%SZ')"
            commit="$(git rev-parse --short=8 HEAD 2>/dev/null || echo unknown)"
            go_ldflags="-s -w -X main.Version=${version} -X main.buildTime=${build_time} -X main.commit=${commit} -linkmode=external -extldflags=-Wl,-O3,--as-needed"

            # Sync/embed the UI when supported by this revision.
            if make -n sync-shell >/dev/null 2>&1; then
              make sync-shell
            fi

            if [[ -f default.pgo ]]; then
              pgo_flag=(-pgo=default.pgo)
            fi

            go build \
              -tags 'distro_binary withshell' \
              -ldflags "$go_ldflags" \
              -buildmode=pie \
              -trimpath \
              -mod=readonly \
              -modcacherw \
              "${pgo_flag[@]}" \
              -o dms \
              ./cmd/dms
          }

          package() {
            local root="$srcdir/DankMaterialShell"
            local desktop
            install -Dm0755 "$root/core/dms" "$pkgdir/usr/bin/dms"

            # Install the user service only when this source revision contains it.
            if [[ -f "$root/assets/systemd/dms.service" ]]; then
              install -Dm0644 "$root/assets/systemd/dms.service" \
                "$pkgdir/usr/lib/systemd/user/dms.service"
            fi

            # Generate completions from the binary being packaged; this avoids
            # mixing completion scripts from an unrelated fixed release.
            install -d "$pkgdir/usr/share/bash-completion/completions"
            install -d "$pkgdir/usr/share/fish/vendor_completions.d"
            install -d "$pkgdir/usr/share/zsh/site-functions"
            "$pkgdir/usr/bin/dms" completion bash \
              > "$pkgdir/usr/share/bash-completion/completions/dms" 2>/dev/null || true
            "$pkgdir/usr/bin/dms" completion fish \
              > "$pkgdir/usr/share/fish/vendor_completions.d/dms.fish" 2>/dev/null || true
            "$pkgdir/usr/bin/dms" completion zsh \
              > "$pkgdir/usr/share/zsh/site-functions/_dms" 2>/dev/null || true

            # Desktop entries vary between upstream revisions. Install only
            # entries that actually exist, and log the omissions.
            install -d "$pkgdir/usr/share/applications"
            for desktop in \
              dms-open.desktop \
              com.danklinux.dms.desktop \
              com.danklinux.dms.notepad.desktop
            do
              if [[ -f "$root/assets/$desktop" ]]; then
                install -Dm0644 "$root/assets/$desktop" \
                  "$pkgdir/usr/share/applications/$desktop"
              else
                echo "WARNING: upstream desktop entry not present: assets/$desktop"
              fi
            done

            # Upstream has used different icon names/locations over time.
            if [[ -f "$root/assets/com.danklinux.dms.svg" ]]; then
              install -Dm0644 "$root/assets/com.danklinux.dms.svg" \
                "$pkgdir/usr/share/icons/hicolor/scalable/apps/com.danklinux.dms.svg"
            elif [[ -f "$root/core/assets/danklogo.svg" ]]; then
              install -Dm0644 "$root/core/assets/danklogo.svg" \
                "$pkgdir/usr/share/icons/hicolor/scalable/apps/danklogo.svg"
            else
              echo "WARNING: no known DMS SVG icon found in source tree"
            fi

            install -Dm0644 "$root/README.md" \
              "$pkgdir/usr/share/doc/$pkgname/README.md"
            if [[ -d "$root/docs" ]]; then
              install -d "$pkgdir/usr/share/doc/$pkgname"
              cp -a "$root/docs/." "$pkgdir/usr/share/doc/$pkgname/"
            fi
          }
          PKGBUILD

          chown builder:builder /home/builder/dms-build/PKGBUILD

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /home/builder/.ccache
          key: dms-ccache-zen3-${{ runner.os }}-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            dms-ccache-zen3-${{ runner.os }}-

      - name: Build Arch package
        shell: bash
        run: |
          set -euo pipefail
          chown -R builder:builder /home/builder/.ccache
          su builder -s /bin/bash -c '
            set -euo pipefail
            cd /home/builder/dms-build
            export MAKEFLAGS="-j$(nproc)"
            export CCACHE_DIR="/home/builder/.ccache"
            export PATH="/usr/lib/ccache/bin:$PATH"
            ccache --zero-stats || true
            makepkg --syncdeps --cleanbuild --clean --noconfirm
            ccache --show-stats || true
          '

      - name: Verify package and prepare release
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR=/home/builder/dms-build
          PKG_PATH="$(find "$BUILD_DIR" -maxdepth 1 -type f \
            -name 'dms-shell-git-*.pkg.tar.zst' \
            ! -name 'dms-shell-git-debug-*' -print -quit)"
          if [[ -z "$PKG_PATH" ]]; then
            echo "ERROR: Main package not found."
            ls -lah "$BUILD_DIR"
            exit 1
          fi

          echo "Package: $PKG_PATH"
          pacman -Qip "$PKG_PATH"
          bsdtar -tf "$PKG_PATH" > /tmp/package-contents.txt
          grep -qx 'usr/bin/dms' /tmp/package-contents.txt || {
            echo "ERROR: usr/bin/dms missing from package."
            exit 1
          }
          if grep -q '^usr/share/quickshell/' /tmp/package-contents.txt; then
            echo "ERROR: Separate /usr/share/quickshell payload found."
            exit 1
          fi

          VERIFY_DIR=/home/builder/package-check
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          bsdtar -xf "$PKG_PATH" -C "$VERIFY_DIR"
          DMS="$VERIFY_DIR/usr/bin/dms"

          file "$DMS"
          go version -m "$DMS" | grep -E \
            'path|build|CGO_ENABLED|GOARCH|GOAMD64|GOOS|tags|trimpath|vcs.revision|vcs.time' || true
          go version -m "$DMS" | grep -q 'GOAMD64=v3' || {
            echo "ERROR: Binary is not GOAMD64=v3."
            exit 1
          }
          readelf -h "$DMS" | grep -E 'Type:|Machine:|OS/ABI:'
          readelf -d "$DMS" | grep NEEDED || true
          readelf -d "$DMS" | grep -q 'libc.so.6' || {
            echo "ERROR: Expected libc.so.6 dependency not found."
            exit 1
          }

          sha256sum "$DMS"
          sha256sum "$PKG_PATH" > "${PKG_PATH}.sha256"

          RELEASE_DIR=/home/builder/release
          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"
          cp "$PKG_PATH" "${PKG_PATH}.sha256" "$RELEASE_DIR/"

          VERSION="$(basename "$PKG_PATH" | sed -E \
            's/^dms-shell-git-(.*)-x86_64\.pkg\.tar\.zst$/\1/')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ls -lh "$RELEASE_DIR"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.verify.outputs.version }}-v3
          name: dms-shell-git ${{ steps.verify.outputs.version }} (x86-64-v3 / Zen 3)
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            ## DankMaterialShell Git Build

            Automated Arch Linux package built from the latest upstream Git revision.

            ### Build configuration
            - Architecture: `x86_64`
            - CPU target: AMD Zen 3 (`znver3`)
            - Go target: `GOAMD64=v3`
            - CGO: enabled
            - PIE: enabled
            - Optimization: `-O3`
            - CPU tuning: `-march=znver3 -mtune=znver3`
            - Quickshell: runtime dependency
            - DMS UI: built using the upstream source build process where supported
            - Package format: Arch Linux `.pkg.tar.zst`

            ### Installation
            ```bash
            sudo pacman -U dms-shell-git-*.pkg.tar.zst
            ```

            ### Compatibility
            This package requires an x86-64-v3-capable CPU and is tuned for AMD Zen 3.
          files: |
            /home/builder/release/*.pkg.tar.zst
            /home/builder/release/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}